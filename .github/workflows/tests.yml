name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python tests/run_all_tests.py
      - name: Frozen corpus hashes
        run: python benchmarks/verify_corpus_hashes.py
      - name: Frozen benchmark regression
        run: python benchmarks/verify_frozen_regression.py
