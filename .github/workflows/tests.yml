name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python tests/run_all_tests.py
      - name: Temporal CLI demo
        run: bash demo/run_temporal_demo.sh
      - name: Real Git history demo
        if: matrix.python-version == '3.13'
        run: python demo/real_history/run.py --repo . --limit 50
      - name: Vite 50-commit real-history demo
        if: matrix.python-version == '3.13'
        run: bash demo/real_history/run_vite_50.sh
      - name: Frozen corpus hashes
        run: python benchmarks/verify_corpus_hashes.py
      - name: Frozen benchmark regression
        run: python benchmarks/verify_frozen_regression.py
